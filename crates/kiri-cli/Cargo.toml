[package]
name = "kiri-cli"
version = "0.3.1"
edition = "2024"

[[bin]]
name = "kiri"
path = "src/main.rs"

[dependencies]
kiri-core = { path = "../kiri-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
